# Swoole 版网关 compose —— Linux host 网络版（服务器推荐）
#
# 与 docker-compose.yml 二选一，不要同时 -f 叠加：
#   docker compose -f docker-compose.linux.yml up -d --build gb28181-sip
#   docker compose -f docker-compose.linux.yml --profile onvif up -d --build
#
# host 网络的优势：SIP UDP 直通宿主协议栈（无 NAT 转换）、WS-Discovery 组播
# 直接到达局域网（ONVIF 自动发现在 Linux 容器内可用）、省去端口映射。
# 回连宿主机服务直接用 127.0.0.1。

x-common-env: &common-env
  GB_REDIS_HOST: ${GB_REDIS_HOST:-127.0.0.1}
  GB_REDIS_PORT: ${GB_REDIS_PORT:-6379}
  GB_REDIS_PASSWORD: ${GB_REDIS_PASSWORD:-}
  GB_REDIS_DATABASE: ${GB_REDIS_DATABASE:-11}
  GB_API_HOCK_URL: ${GB_API_HOCK_URL:-http://127.0.0.1:8886/api/v2/gb/server/hook}
  GB_API_TOKEN: ${GB_API_TOKEN:-}

services:
  gb28181-sip:
    build:
      context: .
      args:
        SWOOLE_VERSION: ${SWOOLE_VERSION:-6.6.0}
    container_name: gb28181-sip
    network_mode: host
    volumes:
      - ..:/app
    working_dir: /app
    environment:
      <<: *common-env
      GB_API_PULL_URL: ${GB_API_PULL_URL:-http://127.0.0.1:8886/api/v2/gb/devices/pull}
      GB_SIP_PORT: ${GB_SIP_PORT:-15060}
    command: php webman gb28181:swoole start
    init: true
    tty: true
    stdin_open: true
    restart: unless-stopped

  onvif-gateway:
    build:
      context: .
      args:
        SWOOLE_VERSION: ${SWOOLE_VERSION:-6.6.0}
    container_name: onvif-gateway
    network_mode: host
    volumes:
      - ..:/app
    working_dir: /app
    environment:
      <<: *common-env
      ONVIF_BIND_IP: ${ONVIF_BIND_IP:-0.0.0.0}
      ONVIF_DISCOVERY_ENABLED: ${ONVIF_DISCOVERY_ENABLED:-true}
      ONVIF_DEFAULT_USERNAME: ${ONVIF_DEFAULT_USERNAME:-admin}
      ONVIF_DEFAULT_PASSWORD: ${ONVIF_DEFAULT_PASSWORD:-}
    command: php webman onvif:server start
    init: true
    tty: true
    stdin_open: true
    restart: unless-stopped
    profiles: ["onvif"]
