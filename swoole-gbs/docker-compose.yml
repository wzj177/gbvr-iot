services:
  gb28181-sip:
    build: .
    container_name: gb28181-sip
    # 挂载整个项目（webman 命令依赖 app/ + Gb28181Gateway/src + vendor + config）
    volumes:
      - ..:/app
    working_dir: /app
    ports:
      - "15060:15060/udp"
      - "15060:15060/tcp"
    # 环境变量按部署环境覆盖（见 server.php 头部注释）：
    #   GB_REDIS_HOST / GB_REDIS_PORT / GB_API_HOCK_URL / GB_API_PULL_URL / GB_API_TOKEN ...
    environment:
      - GB_REDIS_HOST=${GB_REDIS_HOST:-host.docker.internal}
      - GB_REDIS_PORT=${GB_REDIS_PORT:-6379}
      - GB_API_HOCK_URL=${GB_API_HOCK_URL:-http://host.docker.internal:8886/api/v2/gb/server/hook}
      - GB_API_PULL_URL=${GB_API_PULL_URL:-http://host.docker.internal:8886/api/v2/gb/devices/pull}
      - GB_API_TOKEN=${GB_API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: php webman gb28181:swoole start
    tty: true
    stdin_open: true
    restart: unless-stopped

  # ONVIF 网关：WS-Discovery 发现 + onvif:commands 命令消费
  # 摄像头与网关需同一局域网（发现走链路本地组播）；host 网络模式下组播最可靠
  onvif-gateway:
    build: .
    container_name: onvif-gateway
    volumes:
      - ..:/app
    working_dir: /app
    environment:
      - GB_REDIS_HOST=${GB_REDIS_HOST:-host.docker.internal}
      - GB_REDIS_PORT=${GB_REDIS_PORT:-6379}
      - GB_API_HOCK_URL=${GB_API_HOCK_URL:-http://host.docker.internal:8886/api/v2/gb/server/hook}
      - GB_API_TOKEN=${GB_API_TOKEN:-}
      - ONVIF_DEFAULT_USERNAME=${ONVIF_DEFAULT_USERNAME:-admin}
      - ONVIF_DEFAULT_PASSWORD=${ONVIF_DEFAULT_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: php webman onvif:server start
    tty: true
    stdin_open: true
    restart: unless-stopped
    profiles: ["onvif"]   # docker compose --profile onvif up 启用
